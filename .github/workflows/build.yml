name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo install cargo-ndk --locked
      - name: Build Gifski native library
        working-directory: native
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
      - name: Patch Kotlin sources
        run: |
          python3 - <<'PY'
          import re
          p = "app/src/main/java/com/gifforge/app/media/GifCropper.kt"
          s = open(p).read()
          i = s.find("fun copyUriToCache")
          j = s.find("suspend fun readGifMeta")
          if i != -1 and j != -1 and "return try" not in s[i:j]:
              new = (
                  "fun copyUriToCache(ctx: Context, uri: Uri, name: String): File? {\n"
                  "    return try {\n"
                  "        val f = File(ctx.cacheDir, name)\n"
                  "        val input = ctx.contentResolver.openInputStream(uri) ?: return null\n"
                  "        input.use { i -> f.outputStream().use { o -> i.copyTo(o) } }\n"
                  "        f\n"
                  "    } catch (e: Exception) {\n"
                  "        null\n"
                  "    }\n"
                  "}\n\n"
              )
              open(p, "w").write(s[:i] + new + s[j:])
              print("patched GifCropper.kt")
          else:
              print("GifCropper.kt already fine")
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GifForge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
