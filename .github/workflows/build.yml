name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arabic guard
        run: bash tools/check_arabic.sh
      - name: String gate (AR10)
        run: python3 tools/check_strings.py
      - name: Fetch our FFmpeg engine (made by the Build FFmpeg engine workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          if gh release download ffmpeg-engine -p ffmpeg-kit.aar -D app/libs --clobber; then
            echo "using our FFmpeg engine"
          else
            echo "no own engine yet: falling back to the ffmpegKit property (video export may be unavailable)"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo install cargo-ndk --locked
      - name: Build Gifski native library
        working-directory: native
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
          # only libmediaforge_native is loaded (gifski is linked inside it): drop the stray libgifski-*.so copies
          rm -f ../app/src/main/jniLibs/*/libgifski*.so
          ls -l ../app/src/main/jniLibs/*/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unit tests (subtitle formats, encodings, undo, find, effects, tools)
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --console=plain 2>&1 | tee gradle-test.log
      - name: Failure report (committed to branch ci-log, readable without artifact storage)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "run ${{ github.run_id }} commit ${{ github.sha }}"; echo;
            grep -E "^e: |error:|FAILED|Exception|Error:" gradle-test.log | head -200;
            for f in $(find app/build/test-results -name '*.xml' 2>/dev/null); do
              grep -q "<failure" "$f" && { echo "== $f"; grep -A3 "<failure" "$f" | head -40; }
            done; } > ci-failure.txt || true
          B=$(base64 -w0 ci-failure.txt)
          SHA=$(gh api repos/${{ github.repository }}/contents/ci-failure.txt?ref=ci-log -q .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/${{ github.repository }}/contents/ci-failure.txt -f message="ci failure ${{ github.run_id }}" -f content="$B" -f branch=ci-log -f sha="$SHA" >/dev/null
          else
            gh api -X PUT repos/${{ github.repository }}/contents/ci-failure.txt -f message="ci failure ${{ github.run_id }}" -f content="$B" -f branch=ci-log >/dev/null || \
            { git -c user.name=ci -c user.email=ci@local checkout --orphan ci-log && git rm -rfq --cached . && cp ci-failure.txt /tmp/ && git clean -fdxq && cp /tmp/ci-failure.txt . && git add ci-failure.txt && git -c user.name=ci -c user.email=ci@local commit -qm "ci failure" && git push -f origin ci-log; }
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: |
            gradle-test.log
            app/build/reports/tests/
            app/build/test-results/
      - run: gradle assembleDebug --no-daemon
      - name: APK size report
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)
          ls -l "$APK"
          echo "Biggest files inside the APK (bytes, method, compressed bytes):"
          unzip -lv "$APK" | sort -k1 -n -r | head -12 | awk '{print $1, $2, $3, $8}'
      - name: Collect APK
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK was produced:"; find . -name '*.apk'; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/MediaForge-beta.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-debug-apk
          path: dist/MediaForge-beta.apk
          if-no-files-found: error
      - name: Publish APK to Releases (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create beta dist/MediaForge-beta.apk --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" \
            --title "MediaForge beta (build ${{ github.run_number }})" \
            --notes "Debug APK built from commit $GITHUB_SHA"
